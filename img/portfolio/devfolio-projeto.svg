<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1929" />
      <stop offset="100%" stop-color="#142c48" />
    </linearGradient>
    <linearGradient id="dfBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <filter id="dfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#dfBg)" />

  <!-- Geometric grid -->
  <g opacity="0.06" stroke="#00c6ff" stroke-width="1.5">
    <rect x="50" y="50" width="700" height="500" rx="10" fill="none" />
    <line x1="50" y1="120" x2="750" y2="120" />
  </g>

  <!-- Card Body -->
  <rect x="100" y="80" width="600" height="440" rx="20" fill="#112236" stroke="#1f3b5c" stroke-width="2" filter="url(#dfShadow)" />
  
  <!-- Top bar -->
  <rect x="100" y="80" width="600" height="6" fill="url(#dfBrand)" rx="3" />

  <!-- Badge -->
  <rect x="140" y="130" width="210" height="34" rx="17" fill="#0078ff" fill-opacity="0.2" stroke="#0078ff" stroke-width="1.5" />
  <text x="245" y="153" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#4dabf7" text-anchor="middle" letter-spacing="1.5">PROJETO PESSOAL</text>

  <!-- Title -->
  <text x="140" y="235" font-family="'Raleway', sans-serif" font-size="46" font-weight="800" fill="#ffffff">PORTFÓLIO DEVFOLIO</text>
  
  <text x="140" y="280" font-family="'Poppins', sans-serif" font-size="20" font-weight="600" fill="#74a9d8">DESENVOLVIMENTO EM CASA</text>

  <line x1="140" y1="320" x2="660" y2="320" stroke="#1f3b5c" stroke-width="1.5" />

  <!-- Description -->
  <text x="140" y="365" font-family="'Roboto', sans-serif" font-size="16" fill="#cbd5e1">Portfólio web pessoal e profissional construído de forma autônoma.</text>
  <text x="140" y="398" font-family="'Roboto', sans-serif" font-size="15" fill="#94a3b8">Personalização completa, responsividade, integração de certificados e código.</text>

  <!-- Pills -->
  <g transform="translate(140, 440)">
    <rect x="0" y="0" width="80" height="32" rx="8" fill="#1b334d" />
    <text x="40" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#b9d5ee" text-anchor="middle">HTML5</text>

    <rect x="90" y="0" width="80" height="32" rx="8" fill="#1b334d" />
    <text x="130" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#b9d5ee" text-anchor="middle">CSS3</text>

    <rect x="180" y="0" width="110" height="32" rx="8" fill="#1b334d" />
    <text x="235" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#b9d5ee" text-anchor="middle">JavaScript</text>

    <rect x="300" y="0" width="140" height="32" rx="8" fill="#1b334d" />
    <text x="370" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#b9d5ee" text-anchor="middle">Design Autônomo</text>
  </g>

  <!-- Globe / Web Graphic -->
  <g transform="translate(600, 130)" stroke="#0078ff" stroke-width="2" fill="none">
    <circle cx="30" cy="30" r="26" />
    <line x1="4" y1="30" x2="56" y2="30" />
    <ellipse cx="30" cy="30" rx="14" ry="26" />
  </g>
</svg>
