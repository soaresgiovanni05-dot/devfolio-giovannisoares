<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0078ff" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)" />

  <!-- Geometric Decorative Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="350" y1="0" x2="350" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
  </g>

  <!-- Outer Ring -->
  <circle cx="300" cy="250" r="145" fill="none" stroke="url(#circleGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6"/>

  <!-- Avatar Base Circle -->
  <circle cx="300" cy="250" r="125" fill="#0d1b2a" stroke="#0078ff" stroke-width="6" filter="url(#shadow)" />

  <!-- Code Monogram / Initials -->
  <text x="300" y="275" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="92" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">GS</text>

  <!-- Subtitle Tag -->
  <rect x="150" y="420" width="300" height="46" rx="23" fill="#ffffff" filter="url(#shadow)" />
  <text x="300" y="450" font-family="'Roboto', sans-serif" font-size="16" font-weight="700" fill="#0078ff" text-anchor="middle" letter-spacing="1.5">GIOVANNI SOARES</text>

  <!-- Role Badge -->
  <rect x="180" y="480" width="240" height="34" rx="17" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <text x="300" y="503" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" fill="#e0e0e0" text-anchor="middle">Desenvolvedor Iniciante</text>

  <!-- Tech Dots / Brackets -->
  <text x="210" y="245" font-family="monospace" font-size="34" font-weight="700" fill="#00d2ff" opacity="0.7">&lt;</text>
  <text x="390" y="245" font-family="monospace" font-size="34" font-weight="700" fill="#00d2ff" opacity="0.7">/&gt;</text>
</svg>
