<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sqlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a24" />
      <stop offset="100%" stop-color="#102e3f" />
    </linearGradient>
    <linearGradient id="sqlBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00758f" />
      <stop offset="100%" stop-color="#00a896" />
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sqlBg)" />

  <!-- Database schematic lines -->
  <g opacity="0.08" stroke="#00a896" stroke-width="1.5">
    <circle cx="200" cy="150" r="80" fill="none" />
    <circle cx="650" cy="450" r="100" fill="none" />
    <line x1="200" y1="150" x2="650" y2="450" stroke-dasharray="8 6" />
  </g>

  <!-- Card Body -->
  <rect x="100" y="80" width="600" height="440" rx="20" fill="#132733" stroke="#1f4256" stroke-width="2" filter="url(#sShadow)" />
  
  <!-- Top bar -->
  <rect x="100" y="80" width="600" height="6" fill="url(#sqlBrand)" rx="3" />

  <!-- Badge -->
  <rect x="140" y="130" width="200" height="34" rx="17" fill="#00a896" fill-opacity="0.18" stroke="#00a896" stroke-width="1.5" />
  <text x="240" y="153" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#2ed8c5" text-anchor="middle" letter-spacing="1.5">ATIVIDADE ACADÊMICA</text>

  <!-- Title -->
  <text x="140" y="235" font-family="'Raleway', sans-serif" font-size="46" font-weight="800" fill="#ffffff">EXERCÍCIOS DE SQL</text>
  
  <text x="140" y="280" font-family="'Poppins', sans-serif" font-size="20" font-weight="600" fill="#6cb4c0">POLITEC • BANCO DE DADOS</text>

  <line x1="140" y1="320" x2="660" y2="320" stroke="#1f4256" stroke-width="1.5" />

  <!-- Description -->
  <text x="140" y="365" font-family="'Roboto', sans-serif" font-size="16" fill="#cbd5e1">Modelagem DDL e criação de tabelas relacionais em MySQL (InnoDB).</text>
  <text x="140" y="398" font-family="'Roboto', sans-serif" font-size="15" fill="#94a3b8">Tabelas tb_projetos e tb_skill com Primary Keys, Auto Increment e Timestamps.</text>

  <!-- Pills -->
  <g transform="translate(140, 440)">
    <rect x="0" y="0" width="80" height="32" rx="8" fill="#1c3746" />
    <text x="40" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#a5d8e2" text-anchor="middle">SQL</text>

    <rect x="90" y="0" width="130" height="32" rx="8" fill="#1c3746" />
    <text x="155" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#a5d8e2" text-anchor="middle">DDL / MySQL</text>

    <rect x="230" y="0" width="120" height="32" rx="8" fill="#1c3746" />
    <text x="290" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#a5d8e2" text-anchor="middle">Relacional</text>

    <rect x="360" y="0" width="100" height="32" rx="8" fill="#1c3746" />
    <text x="410" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#a5d8e2" text-anchor="middle">Escolar</text>
  </g>

  <!-- Database Cylinder Graphic -->
  <g transform="translate(590, 125)" stroke="#00a896" stroke-width="2" fill="none">
    <ellipse cx="35" cy="15" rx="30" ry="12" fill="#00a896" fill-opacity="0.3"/>
    <path d="M5 15 v25 c0 6.6 13.4 12 30 12 s30 -5.4 30 -12 v-25" />
    <path d="M5 40 v25 c0 6.6 13.4 12 30 12 s30 -5.4 30 -12 v-25" />
  </g>
</svg>
