<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="phpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#1c2442" />
    </linearGradient>
    <linearGradient id="phpBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777bb3" />
      <stop offset="100%" stop-color="#4f5b93" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#phpBg)" />

  <!-- Code lines background pattern -->
  <g opacity="0.05" font-family="monospace" font-size="14" fill="#fff">
    <text x="40" y="50">&lt;?php $media = ($nota1 + $nota2) / 2; if ($media &gt;= 6) { echo 'Aprovado'; } ?&gt;</text>
    <text x="40" y="80">for ($i = $num1; $i &lt;= $num2; $i++) { if ($i % 2 == 0) echo $i; }</text>
    <text x="40" y="110">switch ($numero) { case 1: echo 'Janeiro'; break; }</text>
    <text x="40" y="550">if ($lado_A + $lado_B &gt; $lado_C) { echo 'Triângulo Válido'; }</text>
    <text x="40" y="580">if ($usuario == 'ADMIN' &amp;&amp; $senha == '123') { echo 'Acesso OK'; }</text>
  </g>

  <!-- Card Body -->
  <rect x="100" y="80" width="600" height="440" rx="20" fill="#182038" stroke="#2d3b66" stroke-width="2" filter="url(#pShadow)" />
  
  <!-- Top bar -->
  <rect x="100" y="80" width="600" height="6" fill="url(#phpBrand)" rx="3" />

  <!-- Badge -->
  <rect x="140" y="130" width="200" height="34" rx="17" fill="#777bb3" fill-opacity="0.2" stroke="#777bb3" stroke-width="1.5" />
  <text x="240" y="153" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#9ba8e0" text-anchor="middle" letter-spacing="1.5">ATIVIDADE ACADÊMICA</text>

  <!-- Title -->
  <text x="140" y="235" font-family="'Raleway', sans-serif" font-size="46" font-weight="800" fill="#ffffff">EXERCÍCIOS DE PHP</text>
  
  <text x="140" y="280" font-family="'Poppins', sans-serif" font-size="20" font-weight="600" fill="#8898cb">POLITEC • TÉCNICO EM INFORMÁTICA</text>

  <line x1="140" y1="320" x2="660" y2="320" stroke="#2d3b66" stroke-width="1.5" />

  <!-- Description -->
  <text x="140" y="365" font-family="'Roboto', sans-serif" font-size="16" fill="#cbd5e1">Conjunto de 7 exercícios práticos de lógica e programação em PHP.</text>
  <text x="140" y="398" font-family="'Roboto', sans-serif" font-size="15" fill="#94a3b8">Condicionais (if/else, switch), laços for, regras de negócio e validações.</text>

  <!-- Pills -->
  <g transform="translate(140, 440)">
    <rect x="0" y="0" width="80" height="32" rx="8" fill="#253054" />
    <text x="40" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#c3cde9" text-anchor="middle">PHP</text>

    <rect x="90" y="0" width="130" height="32" rx="8" fill="#253054" />
    <text x="155" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#c3cde9" text-anchor="middle">Lógica Estruturada</text>

    <rect x="230" y="0" width="120" height="32" rx="8" fill="#253054" />
    <text x="290" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#c3cde9" text-anchor="middle">7 Atividades</text>

    <rect x="360" y="0" width="100" height="32" rx="8" fill="#253054" />
    <text x="410" y="21" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#c3cde9" text-anchor="middle">Escolar</text>
  </g>

  <!-- Icon / PHP Badge -->
  <g transform="translate(580, 130)">
    <rect width="80" height="50" rx="10" fill="#4f5b93" />
    <text x="40" y="33" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">PHP</text>
  </g>
</svg>
